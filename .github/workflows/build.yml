name: Build Turbo Download Manager APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6'

      - name: Extract project
        run: |
          unzip -q TurboDownloadManager-project-fixed.zip -d project

      - name: Find project
        run: |
          echo "PROJECT_DIR=$(find project -name settings.gradle.kts -printf '%h\n' | head -1)" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          sed -i 's/compileSdk = 37/compileSdk = 35/' app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 35/' app/build.gradle.kts
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurboDownloadManager-debug
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
