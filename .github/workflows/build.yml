name: Build Turbo Download Manager APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract ZIP
        run: |
          unzip -q TurboDownloadManager-project.zip -d project

      - name: Build APK
        run: |
          cd project/TurboDownloadManager
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurboDownloadManager-debug
          path: project/TurboDownloadManager/app/build/outputs/apk/debug/*.apk
